name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rake rubocop

  spec:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rubocop
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
      - name: Build gem
        run: gem build --strict --verbose perforce-facterdb.gemspec

  dual-install:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: spec/dual_install/Gemfile
      DUAL_INSTALL_FACTERDB_VERSION: ${{ matrix.facterdb }}
    strategy:
      fail-fast: false
      matrix:
        facterdb: ['~> 3.0', '4.5.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run dual-install spec
        run: bundle exec rspec spec/dual_install

  tests:
    if: always()
    needs: [rubocop, spec, dual-install]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          [ "${{ needs.rubocop.result }}" = "success" ] && [ "${{ needs.spec.result }}" = "success" ] && [ "${{ needs.dual-install.result }}" = "success" ]
      - run: echo Test suite completed
