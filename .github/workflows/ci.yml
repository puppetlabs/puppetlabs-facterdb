name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rake rubocop

  spec:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rubocop
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
      - name: Build gem
        run: gem build --strict --verbose puppetlabs-facterdb.gemspec

  facts:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rubocop
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Validate fact files
        run: bundle exec rake facts:validate

  dual-install:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: spec/integration/dual_install/Gemfile
      DUAL_INSTALL_FACTERDB_VERSION: ${{ matrix.facterdb }}
    strategy:
      fail-fast: false
      matrix:
        facterdb: ['~> 3.0', '4.5.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run dual-install spec
        run: bundle exec rspec spec/integration/dual_install

  tests:
    if: always()
    needs: [rubocop, spec, facts, dual-install]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          [ "${{ needs.rubocop.result }}" = "success" ] && [ "${{ needs.spec.result }}" = "success" ] && [ "${{ needs.facts.result }}" = "success" ] && [ "${{ needs.dual-install.result }}" = "success" ]
      - run: echo Test suite completed
