# Puppet Core 9 supported operating systems, expressed as fact filename tokens.
# Source: https://help.puppet.com/core/9/Content/PuppetCore/supported_operating_systems.htm
# (agent 9.1.3, fetched 2026-11-11). Update this list on every Puppet Core release.
#
# Naming rule: os = os.name downcased, release = os.release.major, arch = os.hardware.
# macOS follows upstream facterdb: darwin-<kernel major>-<arch> (macOS 14 = 23, 15 = 24, 26 = 25).
#
# rake platforms:check and the platforms config spec fail when a triple listed here has
# neither an entry nor a skip reason in config/platforms.yml. `name` is informational only.
core_supported:
  - { os: debian, release: '11', arch: x86_64, name: Debian 11 }
  - { os: debian, release: '11', arch: aarch64, name: Debian 11 }
  - { os: debian, release: '12', arch: x86_64, name: Debian 12 }
  - { os: debian, release: '12', arch: aarch64, name: Debian 12 }
  - { os: debian, release: '12', arch: armv7l, name: Debian 12 }
  - { os: debian, release: '13', arch: x86_64, name: Debian 13 }
  - { os: debian, release: '13', arch: aarch64, name: Debian 13 }
  - { os: fedora, release: '41', arch: x86_64, name: Fedora 41 }
  - { os: darwin, release: '23', arch: x86_64, name: macOS 14 }
  - { os: darwin, release: '23', arch: arm64, name: macOS 14 }
  - { os: darwin, release: '24', arch: x86_64, name: macOS 15 }
  - { os: darwin, release: '24', arch: arm64, name: macOS 15 }
  - { os: darwin, release: '25', arch: x86_64, name: macOS 26 }
  - { os: darwin, release: '25', arch: arm64, name: macOS 26 }
  - { os: windows, release: '11', arch: x86_64, name: Windows 11 Enterprise }
